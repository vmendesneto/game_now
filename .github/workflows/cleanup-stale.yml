name: Limpar execucoes obsoletas

# One-time automatic cleanup when this workflow is introduced; afterwards,
# manual dispatch is available if historical runs clog the Actions queue.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: game-now-actions-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete runs but preserve latest main and open PR checks
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const active = new Map();
            const main = await github.rest.repos.getBranch({owner, repo, branch: "main"});
            active.set("main", main.data.commit.sha);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            });
            for (const pr of prs) {
              if (pr.head.repo?.full_name === `${owner}/${repo}`) {
                active.set(pr.head.ref, pr.head.sha);
              }
            }

            const states = ["queued", "in_progress", "waiting", "requested"];
            const batches = await Promise.all(states.map(status =>
              github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, status, per_page: 100,
              })
            ));
            const runs = [...new Map(batches.flat().map(run => [run.id, run])).values()]
              .filter(run => ["Testes Game Now", "ASR pt-BR CPU real"].includes(run.name));
            runs.sort((a, b) => {
              const validA = Number(active.get(a.head_branch) === a.head_sha);
              const validB = Number(active.get(b.head_branch) === b.head_sha);
              return validB - validA
                || Number(b.event === "pull_request") - Number(a.event === "pull_request")
                || new Date(b.created_at) - new Date(a.created_at);
            });

            const retained = new Set();
            let cancelled = 0;
            let failures = 0;
            for (const run of runs) {
              const key = `${run.name}:${run.head_branch}`;
              const valid = active.get(run.head_branch) === run.head_sha;
              if (valid && !retained.has(key)) {
                retained.add(key);
                core.info(`Retained ${run.id}: ${key} (${run.status})`);
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: run.id,
                });
                cancelled += 1;
                core.info(`Cancelled superseded run ${run.id} (${key})`);
              } catch (error) {
                // A run may complete between listing and cancellation.
                failures += 1;
                core.warning(`Could not cancel ${run.id}: ${error.message}`);
              }
            }
            core.info(`Checked ${runs.length} pending/running jobs; cancelled ${cancelled}, retained ${retained.size}, cancel errors ${failures}`);
            if (failures > 0) core.setFailed("Some obsolete runs could not be cancelled");
