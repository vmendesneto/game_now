name: Testes Game Now

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One current execution per branch/PR; avoid duplicate push + PR builds.
concurrency:
  group: game-now-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and FFmpeg wheel (no apt mirror)
        run: python -m pip install --timeout 15 --retries 1 -r requirements-dev.txt imageio-ffmpeg==0.8.1
      - name: Expose FFmpeg executable from wheel
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg

          binary = Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert binary.is_file(), "FFmpeg executable unavailable"
          tools = Path(os.environ["RUNNER_TEMP"]) / "game-now-tools"
          tools.mkdir(exist_ok=True)
          (tools / "ffmpeg").symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as paths:
              print(tools, file=paths)
          PY
          "$RUNNER_TEMP/game-now-tools/ffmpeg" -version | head -n 2
      - name: Generate canonical JSON schema
        run: python scripts/export_schema.py
      - name: Check tracked schema
        run: git diff --exit-code -- schemas/v1.schema.json
      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js
      - name: Benchmark bounded overlapping window assembly (no ASR)
        run: python -m scripts.benchmark_asr_windows
      - name: Run tests
        run: python -m pytest -q
