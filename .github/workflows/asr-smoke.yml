name: ASR pt-BR CPU real

# A model download is expensive and needs external services. Run it only for
# ASR changes or by explicit request; ordinary commits use the general suite.
on:
  push:
    branches: [main]
    paths:
      - 'app/asr.py'
      - 'app/asr_windows.py'
      - 'app/asr_vocabulary.py'
      - 'requirements-asr.txt'
      - 'tests/test_asr_real.py'
      - 'tests/test_asr_vocabulary_real.py'
      - '.github/workflows/asr-smoke.yml'
  pull_request:
    paths:
      - 'app/asr.py'
      - 'app/asr_windows.py'
      - 'app/asr_vocabulary.py'
      - 'requirements-asr.txt'
      - 'tests/test_asr_real.py'
      - 'tests/test_asr_vocabulary_real.py'
      - '.github/workflows/asr-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-now-asr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-portuguese:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies and bundled native speech libraries
        run: python -m pip install --timeout 20 --retries 1 -r requirements-dev.txt -r requirements-asr.txt imageio-ffmpeg==0.8.1 espeakng-loader==0.2.4
      - name: Expose FFmpeg executable from wheel
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg

          binary = Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert binary.is_file(), "FFmpeg executable unavailable"
          tools = Path(os.environ["RUNNER_TEMP"]) / "game-now-tools"
          tools.mkdir(exist_ok=True)
          (tools / "ffmpeg").symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as paths:
              print(tools, file=paths)
          PY
      - name: Transcribe generated Portuguese speech on CPU with real model
        env:
          GAME_NOW_REAL_ASR: "1"
        run: python -m pytest -q -s tests/test_asr_real.py tests/test_asr_vocabulary_real.py
